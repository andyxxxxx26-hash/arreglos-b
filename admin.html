<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Administración | Arreglos Bella</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-page">
  <header class="admin-header"><a href="index.html" class="logo"><span class="logo-mark">b.</span><span>Arreglos <strong>Bella</strong><small>ADMINISTRACIÓN</small></span></a><a class="back-link" href="index.html">← Ver tienda</a></header>
  <main class="admin-main">
    <section class="login-panel" id="login-panel">
      <p class="eyebrow">ACCESO PRIVADO</p><h1>Hola de nuevo.</h1><p class="panel-intro">Inicia sesión para administrar tus arreglos.</p>
      <form id="login-form">
        <label>Correo electrónico<input type="email" name="email" autocomplete="username" required></label>
        <label>Contraseña<input type="password" name="password" autocomplete="current-password" required></label>
        <button class="button button-dark" type="submit">Entrar <span>↗</span></button>
      </form>
      <p class="notice" id="login-notice" role="status" aria-live="polite"></p>
    </section>

    <section class="dashboard" id="dashboard" hidden>
      <div class="dashboard-top">
        <div>
          <p class="eyebrow">TU CATÁLOGO</p>
          <h1>Administra tus arreglos.</h1>
          <p class="panel-intro">Los cambios se reflejan en la tienda pública.</p>
        </div>
        <button class="button button-quiet" id="logout-button" type="button">Cerrar sesión</button>
      </div>

      <!-- Seksion para iti Estadistika ti Visita / Interaksion -->
      <section class="stats-section" style="margin-bottom: 30px; background: var(--paper, #f5eee7); padding: 20px; border-radius: 8px;">
        <h2 style="font-family: var(--serif); font-size: 1.4rem; margin-top: 0; margin-bottom: 12px;">Visitas por día 📊</h2>
        <div id="stats-container">
          <p>Cargando estadísticas...</p>
        </div>
      </section>

      <div class="admin-columns">
        <section class="editor-panel">
          <h2 id="form-title">Agregar arreglo</h2>
          <form id="product-form">
            <input type="hidden" name="id">
            <input type="hidden" name="old_image_path">
            <label>Nombre del arreglo<input name="name" maxlength="100" required></label>
            <label>Descripción<textarea name="description" maxlength="300" rows="3" required></textarea></label>
            <div class="form-row"><label>Precio (S/)<input name="price" type="number" min="0" step="0.01" required></label><label>Etiqueta (opcional)<input name="badge" maxlength="35" placeholder="Ej. FAVORITO"></label></div>
            <label>Foto del arreglo<input name="image" type="file" accept="image/jpeg,image/png,image/webp"><small>JPG, PNG o WebP · máximo 5 MB</small></label>
            <label>O pega una URL de imagen<input name="image_url" type="url" placeholder="https://..."><small>Si subes un archivo, se usará esa foto.</small></label>
            <label class="checkbox-label"><input name="active" type="checkbox" checked> Mostrar en la tienda</label>
            <div class="form-actions"><button class="button button-dark" type="submit" id="save-button">Guardar arreglo <span>↗</span></button><button class="button button-quiet" type="button" id="cancel-edit" hidden>Cancelar</button></div>
          </form>
          <p class="notice" id="form-notice" role="status" aria-live="polite"></p>
        </section>
        <section class="inventory-panel"><div class="inventory-title"><h2>Arreglos actuales</h2><span id="product-count"></span></div><div id="product-list" class="admin-product-list"></div></section>
      </div>
    </section>
    <p class="notice global-notice" id="global-notice" role="status" aria-live="polite"></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin.js" defer></script>
</body>
</html>
